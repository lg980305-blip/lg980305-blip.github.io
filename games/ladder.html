<html lang="ko">

<title>사다리 타기 — BLACKHOLEMAN ARCADE</title>

<style>
  :root{
    --bg: #14171f;
    --panel: #1d2130;
    --panel-border: #2a2f42;
    --text-primary: #f2f4f8;
    --text-secondary: #8b93a8;
    --line: #454d68;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #232840 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }
  .header{ text-align: center; margin-bottom: 18px; }
  .title{
    font-family: 'Jua', sans-serif;
    font-size: clamp(32px, 6vw, 48px);
    letter-spacing: 1px;
    color: var(--text-primary);
    position: relative;
    display: inline-block;
  }
  .title-wrap{ position: relative; display:inline-block; }
  .underline{ display:block; width: 100%; height: 10px; margin-top: -2px; }
  .subtitle{ color: var(--text-secondary); font-size: 14px; margin-top: 8px; }

  .cast{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap: 4px;
    margin: 14px 0 26px;
  }
  .cast img{
    height: 46px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  }

  .controls{
    display:flex; align-items:center; gap: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 12px 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stepper{ display:flex; align-items:center; gap: 10px; padding-right: 14px; border-right: 1px solid var(--panel-border); }
  .stepper span{ font-size: 13px; color: var(--text-secondary); margin-right: 4px; }
  .step-btn{
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid var(--panel-border);
    background: #262b3d; color: var(--text-primary);
    font-size: 16px; cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, transform .1s;
  }
  .step-btn:hover{ background: #303650; }
  .step-btn:active{ transform: scale(0.92); }
  .step-btn:disabled{ opacity: .35; cursor: not-allowed; }
  .step-count{ width: 26px; text-align: center; font-weight: 700; font-size: 16px; }
  .btn{
    border: none; border-radius: 10px; padding: 9px 16px;
    font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: filter .15s, transform .1s;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{ background: linear-gradient(135deg, #82cbeb, #cc0099); color: #14171f; }
  .btn-primary:hover{ filter: brightness(1.1); }
  .btn-ghost{ background: transparent; color: var(--text-secondary); border: 1px solid var(--panel-border); }
  .btn-ghost:hover{ color: var(--text-primary); border-color: #4a5170; }

  .board{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 20px 10px 10px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    max-width: 96vw;
    overflow-x: auto;
  }
  .hint{ text-align:center; color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; }
  svg{ display:block; }

  .top-circle{ cursor: pointer; transition: transform .12s; }
  .top-circle:hover{ transform: scale(1.08); }
  .top-circle.used{ cursor: default; }
  .top-circle.used:hover{ transform: none; }

  .badge-text{
    font-family: 'Jua', sans-serif;
    font-size: 12px;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .qmark{
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    fill: var(--text-secondary);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .bottom-circle{
    fill: #262b3d;
    stroke: var(--panel-border);
    stroke-width: 2;
  }

  footer{ margin-top: 26px; color: var(--text-secondary); font-size: 12px; text-align: center; }
</style>

<body>
<a class="bhb-back" href="index.html">← ARCADE</a>

  <div class="header">
    <div class="title-wrap">
      <div class="title">사다리타기</div>
      <svg class="underline" viewBox="0 0 200 10" preserveAspectRatio="none">
        <path d="M2,6 Q30,2 55,6 T105,6 T155,6 T198,6" fill="none" stroke="#cc0099" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="subtitle">시작 번호를 눌러서 나만의 사다리 경로를 확인해보세요</div>
  </div>

  <div class="cast">
    <img src="../assets/mascots/1819ba82c4.webp" alt="holedog" loading="lazy" decoding="async" width="151" height="220">
    <img src="../assets/mascots/26fea5ccee.webp" alt="blackhole" style="height:56px;" loading="lazy" decoding="async" width="175" height="220">
    <img src="../assets/mascots/f77670d958.webp" alt="holecat" loading="lazy" decoding="async" width="220" height="199">
  </div>

  <div class="controls">
    <div class="stepper">
      <span>인원 수</span>
      <button class="step-btn" id="decBtn">−</button>
      <div class="step-count" id="countLabel">5</div>
      <button class="step-btn" id="incBtn">+</button>
    </div>
    <button class="btn btn-primary" id="shuffleBtn">🔀 사다리 다시 그리기</button>
    <button class="btn btn-ghost" id="revealBtn">👀 전체 공개</button>
  </div>

  <div class="board">
    <div class="hint">위쪽 캐릭터를 클릭하면 경로가 내려갑니다</div>
    <svg id="ladderSvg"></svg>
  </div>

  <footer>클릭할 때마다 실제 경로를 따라 이동합니다 · 결과는 항상 1:1 매칭됩니다</footer>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('ladderSvg');
  const countLabel = document.getElementById('countLabel');
  const decBtn = document.getElementById('decBtn');
  const incBtn = document.getElementById('incBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const revealBtn = document.getElementById('revealBtn');

  const MIN_N = 2, MAX_N = 8;

  // mascot assets: [data-uri, natural width, natural height, accent color]
  const MASCOTS = [
    { src: '../assets/mascots/26fea5ccee.webp', w: 175, h: 220, color: '#82CBEB' },
    { src: '../assets/mascots/f77670d958.webp',   w: 220, h: 199, color: '#CC0099' },
    { src: '../assets/mascots/1819ba82c4.webp',   w: 151, h: 220, color: '#92D050' }
  ];

  const COL_GAP = 92;
  const PAD_X = 54;
  const TOP_Y = 52;
  const BOTTOM_MARGIN = 54;
  const ROWS = 13;
  const ROW_GAP = 32;
  const LADDER_TOP = TOP_Y + 46;
  const NODE_H = 56; // display height for mascot at nodes
  const MARKER_H = 40; // display height while traveling

  let n = 5;
  let rungs = [];
  let bottomOrder = [];
  let revealed = [];
  let usedStart = [];
  let animating = false;

  function mascotFor(i){ return MASCOTS[i % MASCOTS.length]; }
  function ladderBottom(){ return LADDER_TOP + ROWS * ROW_GAP; }
  function svgWidth(){ return PAD_X*2 + (n-1)*COL_GAP; }
  function svgHeight(){ return ladderBottom() + BOTTOM_MARGIN + 26; }
  function colX(c){ return PAD_X + c*COL_GAP; }

  function generateRungs(){
    const rows = [];
    for(let r=0; r<ROWS; r++){
      const row = new Array(n-1).fill(false);
      let c = 0;
      while(c < n-1){
        if(Math.random() < 0.42){ row[c] = true; c += 2; }
        else { c += 1; }
      }
      rows.push(row);
    }
    return rows;
  }

  function computePath(startCol){
    let col = startCol;
    const pts = [{ x: colX(col), y: LADDER_TOP }];
    for(let r=0; r<ROWS; r++){
      const y = LADDER_TOP + r*ROW_GAP;
      const yNext = LADDER_TOP + (r+1)*ROW_GAP;
      const row = rungs[r];
      if(col > 0 && row[col-1]){
        pts.push({ x: colX(col), y }); col -= 1; pts.push({ x: colX(col), y });
      } else if(col < n-1 && row[col]){
        pts.push({ x: colX(col), y }); col += 1; pts.push({ x: colX(col), y });
      }
      pts.push({ x: colX(col), y: yNext });
    }
    return { pts, end: col };
  }

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildLadder(){
    n = Math.max(MIN_N, Math.min(MAX_N, n));
    countLabel.textContent = n;
    decBtn.disabled = n <= MIN_N;
    incBtn.disabled = n >= MAX_N;

    rungs = generateRungs();
    bottomOrder = new Array(n).fill(null);
    revealed = new Array(n).fill(false);
    usedStart = new Array(n).fill(false);
    animating = false;

    for(let i=0;i<n;i++){
      const { end } = computePath(i);
      bottomOrder[i] = end;
    }
    render();
  }

  function clipIdFor(prefix, i){ return `${prefix}-clip-${i}`; }

  function addMascotImage(parent, mascot, cx, cy, displayH, clipId){
    const dispW = displayH * (mascot.w / mascot.h);
    if(clipId){
      const clip = el('clipPath', { id: clipId });
      clip.appendChild(el('circle', { cx, cy, r: displayH*0.52 }));
      parent.appendChild(clip);
    }
    const img = el('image', {
      href: mascot.src, x: cx - dispW/2, y: cy - displayH/2,
      width: dispW, height: displayH, preserveAspectRatio: 'xMidYMid meet'
    });
    if(clipId) img.setAttribute('clip-path', `url(#${clipId})`);
    parent.appendChild(img);
    return img;
  }

  function render(){
    svg.setAttribute('viewBox', `0 0 ${svgWidth()} ${svgHeight()}`);
    svg.setAttribute('width', svgWidth());
    svg.setAttribute('height', svgHeight());
    svg.innerHTML = '';

    const defs = el('defs', {});
    const filter = el('filter', { id:'wobble', x:'-20%', y:'-20%', width:'140%', height:'140%' });
    filter.appendChild(el('feTurbulence', { type:'fractalNoise', baseFrequency:'0.012 0.03', numOctaves:'2', seed: String(Math.floor(Math.random()*1000)), result:'noise' }));
    filter.appendChild(el('feDisplacementMap', { in:'SourceGraphic', in2:'noise', scale:'4' }));
    defs.appendChild(filter);
    svg.appendChild(defs);

    const linesGroup = el('g', { filter:'url(#wobble)' });
    svg.appendChild(linesGroup);

    for(let c=0; c<n; c++){
      linesGroup.appendChild(el('line', {
        x1: colX(c), y1: LADDER_TOP, x2: colX(c), y2: ladderBottom(),
        stroke: 'var(--line)', 'stroke-width': 3, 'stroke-linecap':'round'
      }));
    }
    for(let r=0; r<ROWS; r++){
      const y = LADDER_TOP + r*ROW_GAP + ROW_GAP/2;
      rungs[r].forEach((has, c) => {
        if(has){
          linesGroup.appendChild(el('line', {
            x1: colX(c), y1: y, x2: colX(c+1), y2: y,
            stroke: 'var(--line)', 'stroke-width': 3, 'stroke-linecap':'round'
          }));
        }
      });
    }

    const trailGroup = el('g', { id:'trailGroup', filter:'url(#wobble)' });
    svg.appendChild(trailGroup);

    // top nodes: mascot circle + number badge
    const topGroup = el('g', { id:'topGroup' });
    svg.appendChild(topGroup);
    for(let c=0; c<n; c++){
      const mascot = mascotFor(c);
      const g = el('g', { class: 'top-circle' + (usedStart[c] ? ' used' : ''), 'data-col': c, opacity: usedStart[c] ? 0.4 : 1 });
      g.appendChild(el('circle', { cx: colX(c), cy: TOP_Y, r: NODE_H*0.56, fill:'#262b3d' }));
      addMascotImage(g, mascot, colX(c), TOP_Y, NODE_H, clipIdFor('top', c));
      const badge = el('circle', { cx: colX(c)+NODE_H*0.32, cy: TOP_Y+NODE_H*0.32, r: 10, fill: mascot.color, stroke:'#14171f', 'stroke-width':1.5 });
      g.appendChild(badge);
      const badgeText = el('text', { class:'badge-text', x: colX(c)+NODE_H*0.32, y: TOP_Y+NODE_H*0.32+1 });
      badgeText.textContent = c+1;
      g.appendChild(badgeText);
      if(!usedStart[c]) g.addEventListener('click', () => startPath(c));
      topGroup.appendChild(g);
    }

    // bottom nodes
    const bottomGroup = el('g', { id:'bottomGroup' });
    svg.appendChild(bottomGroup);
    for(let c=0; c<n; c++){
      const by = ladderBottom() + BOTTOM_MARGIN - 8;
      const g = el('g', { id:`bottomNode-${c}` });
      g.appendChild(el('circle', { class:'bottom-circle', cx: colX(c), cy: by, r: NODE_H*0.46, id:`bcircle-${c}` }));
      const q = el('text', { class:'qmark', x: colX(c), y: by, id:`qmark-${c}` });
      q.textContent = '?';
      g.appendChild(q);
      bottomGroup.appendChild(g);
    }

    for(let c=0;c<n;c++){
      if(revealed[c]) applyRevealVisual(c, findStartForEnd(c));
    }
  }

  function findStartForEnd(end){
    for(let i=0;i<n;i++) if(bottomOrder[i] === end) return i;
    return -1;
  }

  function applyRevealVisual(endCol, startCol){
    const g = document.getElementById(`bottomNode-${endCol}`);
    const qmark = document.getElementById(`qmark-${endCol}`);
    if(!g) return;
    if(qmark) qmark.remove();
    const mascot = mascotFor(startCol);
    const by = ladderBottom() + BOTTOM_MARGIN - 8;
    addMascotImage(g, mascot, colX(endCol), by, NODE_H*0.82, clipIdFor('bottom', endCol));
    const badge = el('circle', { cx: colX(endCol)+NODE_H*0.26, cy: by+NODE_H*0.26, r: 9, fill: mascot.color, stroke:'#14171f', 'stroke-width':1.5 });
    g.appendChild(badge);
    const badgeText = el('text', { class:'badge-text', x: colX(endCol)+NODE_H*0.26, y: by+NODE_H*0.26+1 });
    badgeText.setAttribute('font-size','11');
    badgeText.textContent = startCol+1;
    g.appendChild(badgeText);
  }

  function startPath(startCol){
    if(animating || usedStart[startCol]) return;
    usedStart[startCol] = true;
    animating = true;
    render();

    const { pts, end } = computePath(startCol);
    const mascot = mascotFor(startCol);
    const trailGroup = document.getElementById('trailGroup');

    const trailPath = el('path', { d:'', fill:'none', stroke: mascot.color, 'stroke-width': 5, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity: 0.9 });
    trailGroup.appendChild(trailPath);

    const markerG = el('g', {});
    markerG.style.filter = `drop-shadow(0 0 6px ${mascot.color})`;
    svg.appendChild(markerG);
    const dispW = MARKER_H * (mascot.w / mascot.h);
    const markerImg = el('image', {
      href: mascot.src, width: dispW, height: MARKER_H,
      x: -dispW/2, y: -MARKER_H/2, preserveAspectRatio:'xMidYMid meet'
    });
    markerG.appendChild(markerImg);

    let segIndex = 0;
    let segStart = performance.now();
    const speed = 0.62;

    function segLength(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
    function updateD(){
      let d = `M ${pts[0].x},${pts[0].y}`;
      for(let i=1;i<=segIndex;i++) d += ` L ${pts[i].x},${pts[i].y}`;
      trailPath.setAttribute('d', d);
    }

    function step(now){
      const wiggle = Math.sin(now/90) * 8;
      if(segIndex >= pts.length - 1){
        const last = pts[pts.length-1];
        markerG.setAttribute('transform', `translate(${last.x},${last.y}) rotate(0)`);
        finishAnimation();
        return;
      }
      const a = pts[segIndex], b = pts[segIndex+1];
      const len = Math.max(segLength(a,b), 0.001);
      const dur = len / speed;
      const t = Math.min(1, (now - segStart) / dur);
      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      markerG.setAttribute('transform', `translate(${x},${y}) rotate(${wiggle})`);

      if(t >= 1){ segIndex += 1; segStart = now; updateD(); }
      requestAnimationFrame(step);
    }

    function finishAnimation(){
      revealed[end] = true;
      markerG.remove();
      trailPath.remove();
      applyRevealVisual(end, startCol);
      animating = false;
    }

    requestAnimationFrame(step);
  }

  function revealAll(){
    if(animating) return;
    let i = 0;
    function next(){
      while(i < n && usedStart[i]) i++;
      if(i >= n) return;
      const col = i; i++;
      startPath(col);
      const wait = setInterval(() => {
        if(!animating){ clearInterval(wait); setTimeout(next, 140); }
      }, 50);
    }
    next();
  }

  decBtn.addEventListener('click', () => { if(!animating){ n -= 1; buildLadder(); } });
  incBtn.addEventListener('click', () => { if(!animating){ n += 1; buildLadder(); } });
  shuffleBtn.addEventListener('click', () => { if(!animating) buildLadder(); });
  revealBtn.addEventListener('click', revealAll);

  buildLadder();
})();
</script>
</body>
