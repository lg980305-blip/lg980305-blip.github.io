<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMF 커머스 인텔리전스 · 새 주소로 이전</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.theamfclub.com/">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0A1A33;--fg:#F2F5FA;--mute:#A9B4C8;--acc:#9DB8FF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  font:16px/1.7 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{max-width:520px;text-align:center}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 18px;color:var(--mute)}
a.btn{display:inline-block;padding:12px 22px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:700;text-decoration:none}
</style>
<script>
/* 옛 주소(github.io/amf) → 새 주소. 새 주소가 열리는지 먼저 확인하고 이동한다. */
(function(){
  var target='https://www.theamfclub.com/'+(/[?&]app=1/.test(location.search)?'?app=1':'');
  var done=false, img=new Image();
  img.onload=function(){ if(!done){ done=true; location.replace(target); } };
  img.src='https://www.theamfclub.com/icon-192.png?probe='+Date.now();
  window.AMF_TARGET=target;
})();
</script>
</head>
<body>
<main>
  <h1>AMF 커머스 인텔리전스가 새 주소로 이전했습니다</h1>
  <p>잠시 후 자동으로 이동합니다. 이동하지 않으면 아래 버튼을 눌러 주세요.</p>
  <a class="btn" id="go" href="https://www.theamfclub.com/">www.theamfclub.com 으로 가기</a>
</main>
<script>document.getElementById('go').href=window.AMF_TARGET||document.getElementById('go').href;</script>
</body>
</html>
