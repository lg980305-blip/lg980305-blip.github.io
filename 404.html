<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 — BLACKHOLEMAN BROS</title>
<meta name="description" content="요청하신 페이지를 찾을 수 없습니다.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02040a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"></noscript>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#02040a;color:#fff;font-family:Pretendard,Arial,sans-serif;
  display:grid;place-items:center;padding:40px 6vw;text-align:center;
  background-image:radial-gradient(circle at 50% 38%,rgba(50,103,255,.16),transparent 42%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px}
.code{font-size:clamp(70px,17vw,150px);font-weight:900;line-height:.85;letter-spacing:-.06em;
  background:linear-gradient(90deg,#1599ff,#7850ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(21px,4.4vw,30px);margin:26px 0 12px;letter-spacing:-.03em}
p{color:rgba(255,255,255,.62);font-size:14px;line-height:1.85;margin:0 0 34px}
.ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em}
.primary{background:linear-gradient(90deg,#168ff5,#8750f5);box-shadow:0 8px 30px rgba(76,89,255,.30)}
.secondary{border:1px solid rgba(255,255,255,.36)}
.btn:focus-visible{outline:2px solid #66c0ff;outline-offset:3px}
.mark{width:52px;height:52px;margin:0 auto 30px;border:2px solid rgba(255,255,255,.75);border-radius:50%;position:relative}
.mark:after{content:"";position:absolute;inset:13px;border:2px solid rgba(255,255,255,.75);border-radius:50%}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true"></div>
  <div class="code">404</div>
  <h1>페이지가 블랙홀에 빨려 들어갔습니다.</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다. 아래 버튼으로 이동해 주세요.</p>
  <div class="ctas">
    <a class="btn primary" href="/index.html">홈으로 가기　→</a>
    <a class="btn secondary" href="/characters.html">캐릭터 보러가기</a>
  </div>
</main>
</body>
</html>
