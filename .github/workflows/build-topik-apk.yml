name: Build TOPIK APK

# 실행 방법: 저장소 > Actions > "Build TOPIK APK" > Run workflow
# topik-android/ 아래를 고쳐 푸시해도 자동으로 돕니다.
# 끝나면 apk/topikasia.apk 와 다운로드 페이지의 체크섬을 갱신해 커밋합니다.

on:
  workflow_dispatch:
  push:
    paths:
      - 'topik-android/**'
      - '.github/workflows/build-topik-apk.yml'

permissions:
  contents: write

concurrency:
  group: topik-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 버전 번호 정하기 (빌드 번호에 따라 항상 증가)
        run: |
          echo "APP_VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.2.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 러너에는 Android SDK 가 이미 설치되어 있다 ($ANDROID_HOME).
      - name: SDK 패키지 설치
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > topik-android/local.properties

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 빌드 (미서명)
        run: gradle -p topik-android assembleRelease --no-daemon --console=plain

      - name: 서명 (uber-apk-signer 내장 디버그 키 · 매번 동일해 업데이트 설치 가능)
        run: |
          set -e
          curl -sSL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar \
            --apks topik-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --out signed --allowResign
          ls -la signed
          cp signed/*-aligned-debugSigned.apk apk/topikasia.apk

      - name: 다운로드 페이지 갱신 (버전 · 크기 · 체크섬)
        run: |
          set -e
          SHA=$(sha256sum apk/topikasia.apk | cut -d' ' -f1)
          MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s apk/topikasia.apk)/1048576}")
          sed -i -E "s|<span id=\"ver\">[^<]*</span>|<span id=\"ver\">${APP_VERSION_NAME}</span>|" apk/index.html
          sed -i -E "s|<span id=\"size\">[^<]*</span>|<span id=\"size\">${MB} MB</span>|" apk/index.html
          sed -i -E "s|<span id=\"sha\">[^<]*</span>|<span id=\"sha\">${SHA}</span>|" apk/index.html
          echo "version=${APP_VERSION_NAME} code=${APP_VERSION_CODE} sha=${SHA}"

      - name: 결과 커밋
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/topikasia.apk apk/index.html
          if git diff --cached --quiet; then
            echo "변동 없음"
          else
            git commit -m "chore(topik): APK ${APP_VERSION_NAME} (build #${{ github.run_number }}) [skip ci]"
            git push
          fi

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: topikasia-apk
          path: apk/topikasia.apk
          retention-days: 30
